name: Mobile scaffold validation

on:
  push:
    branches: [phase21-mobile-prep, phase22-premium-ui]
  pull_request:
    branches: [main, phase21-mobile-prep, phase22-premium-ui]

jobs:
  validate-web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare bundled web assets
        run: npm run web:prepare
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check spv-management.js
          node --check theme.js
          node --check scripts/copy-web-assets.mjs
